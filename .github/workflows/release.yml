name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run instead of publishing"
        type: boolean
        default: true

jobs:
  build-macos:
    name: Build macOS arm64 desktop binaries
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch SQLite and macOS arm64 powersync-sqlite-core
        run: node scripts/fetch-native-deps.mjs --macos-arm64

      - name: Build powersync-lynx.node (macOS arm64)
        run: make node

      - name: Ad-hoc sign macOS arm64 addon
        run: |
          codesign --force --sign - dist/macos/arm64/powersync-lynx.node
          codesign --verify --strict dist/macos/arm64/powersync-lynx.node

      - name: Verify macOS native artifacts
        run: node scripts/check-native-artifacts.mjs --macos

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64
          path: |
            dist/macos/arm64/powersync-lynx.node
            dist/macos/arm64/libpowersync_aarch64.macos.dylib
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows x64 MSVC desktop binaries
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch SQLite and Windows x64 powersync-sqlite-core
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/fetch-native-deps.mjs --windows-x64

      - name: Install Lynxtron host dependencies and runtime
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm --dir examples/hosts/lynxtron install --frozen-lockfile

      - name: Install Lynxtron native build headers
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force native-vendor | Out-Null
          '{"name":"powersync-lynx-native-vendor","private":true}' | Set-Content -Encoding utf8 native-vendor/package.json
          'packages: []' | Set-Content -Encoding utf8 native-vendor/pnpm-workspace.yaml
          pnpm --dir native-vendor add --no-lockfile --ignore-scripts @lynx-js/weak-node-api@0.1.0 @lynx-js/lynx-library-headers@0.0.31

      - name: Build powersync-lynx.node (Windows x64 MSVC)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $importLib = node --input-type=module -e "import { createRequire } from 'node:module'; import path from 'node:path'; import { pathToFileURL } from 'node:url'; const pkg = path.resolve('examples/hosts/lynxtron/package.json'); const req = createRequire(pkg); const rm = await import(pathToFileURL(req.resolve('@lynx-js/lynxtron/runtime-manager')).href); await rm.ensureRuntime({ variant: 'devtool' }); const np = req('@lynx-js/lynxtron/native-paths'); if (!np.importLibraryPath) throw new Error('missing importLibraryPath'); process.stdout.write(np.importLibraryPath);"
          if (-not (Test-Path $importLib)) {
            throw "lynxtron.dll.lib not found at $importLib"
          }
          Write-Host "Using LYNXTRON_IMPORT_LIB=$importLib"
          cmake -S shared -B shared/build-win -A x64 `
            -DPOWERSYNC_BUILD_LYNXTRON_NAPI=ON `
            -DPOWERSYNC_BUILD_TESTS=OFF `
            "-DLYNXTRON_IMPORT_LIB=$importLib"
          cmake --build shared/build-win --config Release --parallel
          New-Item -ItemType Directory -Force dist/windows/x64 | Out-Null
          Copy-Item -Force shared/build-win/Release/powersync-lynx.node dist/windows/x64/powersync-lynx.node

      - name: Verify Windows native artifacts
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/check-native-artifacts.mjs --windows

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x64
          path: |
            dist/windows/x64/powersync-lynx.node
            dist/windows/x64/powersync_x64.dll
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Assemble and publish powersync-lynx
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist-macos-arm64
          path: dist/macos/arm64

      - uses: actions/download-artifact@v4
        with:
          name: dist-windows-x64
          path: dist/windows/x64

      - name: Remove any stray non-release desktop dist directories
        run: rm -rf dist/macos/x64 dist/linux

      - name: Run prepack (typecheck + web-host factory + sqlite)
        run: pnpm run prepack

      - name: Verify all prebuilt desktop native artifacts
        run: node scripts/check-native-artifacts.mjs

      - name: Verify packed consumers and strict dist/ tarball hygiene
        run: node scripts/check-packed-consumers.mjs --require-desktop-binaries

      - name: Dry-run npm publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        run: npm publish --access public
