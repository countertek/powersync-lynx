buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
  }
}

apply plugin: "com.android.library"

def repoRoot = file("..")

android {
  namespace "com.powersync.lynx"
  compileSdkVersion 35

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 35
    consumerProguardFiles "consumer-rules.pro"
    ndk {
      abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }
    externalNativeBuild {
      cmake {
        arguments "-DPOWERSYNC_LYNX_ROOT=${repoRoot.absolutePath}",
            "-DANDROID_STL=c++_shared"
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  sourceSets {
    main {
      java.srcDirs = ["src/main/java"]
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
}

repositories {
  google()
  mavenCentral()
}

tasks.register("fetchSqliteAmalgamation", Exec) {
  workingDir repoRoot
  commandLine "node", "scripts/fetch-native-deps.mjs", "--sqlite"
  inputs.file("${repoRoot}/scripts/fetch-native-deps.mjs")
  outputs.files(
      "${repoRoot}/third_party/sqlite/sqlite3.c",
      "${repoRoot}/third_party/sqlite/sqlite3.h")
}

afterEvaluate {
  tasks.matching { it.name == "preBuild" || it.name.startsWith("configureCMake") }.configureEach {
    dependsOn("fetchSqliteAmalgamation")
  }
}

dependencies {
  implementation "com.powersync:powersync-sqlite-core:0.5.3"
  implementation "androidx.annotation:annotation:1.9.1"
  compileOnly "org.lynxsdk.lynx:lynx:4.0.1"
}
