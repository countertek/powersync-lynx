buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
  }
}

apply plugin: "com.android.application"

def repoRoot = file("../..")

android {
  namespace "com.powersync.lynx.host"
  compileSdk 36
  buildToolsVersion "36.0.0"

  defaultConfig {
    applicationId "com.powersync.lynx.host"
    minSdk 24
    targetSdk 36
    versionCode 1
    versionName "1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    ndk {
      abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }
    externalNativeBuild {
      cmake {
        arguments "-DPOWERSYNC_LYNX_ROOT=${repoRoot.absolutePath}",
            "-DANDROID_STL=c++_shared"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "../src/main/cpp/CMakeLists.txt"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  sourceSets {
    main {
      java.srcDirs = ["src/main/java", "../src/main/java"]
    }
    androidTest {
      assets.srcDirs += ["../../shared/fixtures"]
    }
  }
}

tasks.register("fetchSqliteAmalgamation", Exec) {
  workingDir repoRoot
  commandLine "node", "scripts/fetch-native-deps.mjs", "--sqlite"
  inputs.file("${repoRoot}/scripts/fetch-native-deps.mjs")
  outputs.files(
      "${repoRoot}/third_party/sqlite/sqlite3.c",
      "${repoRoot}/third_party/sqlite/sqlite3.h")
}

afterEvaluate {
  tasks.matching { it.name == "preBuild" || it.name.startsWith("configureCMake") }.configureEach {
    dependsOn("fetchSqliteAmalgamation")
  }
}

dependencies {
  implementation "com.powersync:powersync-sqlite-core:0.5.3"
  implementation "androidx.annotation:annotation:1.9.1"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  androidTestImplementation "androidx.test:runner:1.6.2"
}
