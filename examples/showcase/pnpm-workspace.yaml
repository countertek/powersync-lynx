# Separate from the library workspace so the native install graph
# does not pull @powersync/web / wa-sqlite (see test/install-graph.test.ts).
allowBuilds:
  esbuild: true
autoInstallPeers: false
onlyBuiltDependencies:
  - esbuild
patchedDependencies:
  '@lynx-js/web-core@0.26.0': patches/@lynx-js__web-core@0.26.0.patch
