# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# Local demo only. The HS256 key is a compose-stack secret, not a cloud account.

_type: self-hosted

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: mongodb
  uri: !env PS_MONGO_URI

port: !env PS_PORT

sync_config:
  path: /config/sync-config.yaml

client_auth:
  audience:
    - powersync-dev
    - powersync
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: dev-key-1
        k: !env PS_CLIENT_AUTH_KEY

api:
  tokens:
    - local-demo-admin-token
